			name = "Embed Command Line Tool";
			outputPaths = (
				"$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/servermaster",
			);
			shellPath = /bin/sh;
			shellScript = (
				"# Puts the command line tool inside the bundle, at Contents/Helpers.",
				"#",
				"# A copy and not a build dependency: the two projects are independent, so this",
				"# ships whatever Tools/update-cli.sh last put there. Run that script to refresh",
				"# it — this phase will not notice that the tool has changed on its own.",
				"TOOL=\"$SRCROOT/Tools/servermaster\"",
				"if [ ! -f \"$TOOL\" ]; then",
				"    echo \"warning: $TOOL is missing — this build will not carry the command line tool. Run ./Tools/update-cli.sh\"",
				"    exit 0",
				"fi",
				"",
				"# Contents/Helpers and not Contents/MacOS. The volume is case-insensitive, so",
				"# Contents/MacOS/servermaster and Contents/MacOS/ServerMaster are the same",
				"# file — copying the tool there overwrites the app's own executable, and the",
				"# build still succeeds. Helpers is the conventional place for a bundled tool",
				"# and cannot collide with anything.",
				"DEST=\"$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/servermaster\"",
				"/bin/mkdir -p \"$(dirname \"$DEST\")\"",
				"/bin/cp -f \"$TOOL\" \"$DEST\"",
				"/bin/chmod +x \"$DEST\"",
				"",
				"# Not signed here, on purpose. The tool arrives already signed by its own",
				"# project — same team, hardened runtime — and copying a Mach-O keeps the",
				"# signature, which is embedded in the file. Signing it again in this phase",
				"# is not possible anyway: the phase runs in a sandbox that lets it write the",
				"# declared output but not read it back, and codesign verifies what it has",
				"# just written, so it fails with “the code cannot be read by the verifier”.",
				"#",
				"# Tools/update-cli.sh checks the signature when it refreshes the copy, so a",
				"# broken one is caught there rather than at release time.",
				"",
			);
		};
